<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1A1A1A;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif}
#box{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:__W__px;height:__H__px;overflow:hidden;background:__BG__;transform-origin:0 0;--display:Montserrat;--sans:'Be Vietnam Pro'}
#ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.55));transition:opacity .25s;color:#fff;font-size:13px}
#ctl button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%}
#ctl button:hover{background:rgba(255,255,255,.15)} #ctl svg{width:18px;height:18px;fill:#fff}
#bar{position:relative;flex:1;height:22px;cursor:pointer;display:flex;align-items:center}
#track{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
#fill{position:absolute;left:0;height:5px;border-radius:3px;background:#22C55E;width:0}
.tick{position:absolute;top:6px;width:2px;height:10px;background:rgba(255,255,255,.7);border-radius:1px}
#time{font-variant-numeric:tabular-nums;min-width:78px;text-align:right;font-weight:600}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(26,26,26,.12)}
#big span{display:flex;align-items:center;gap:10px;background:#fff;color:#1A1A1A;border-radius:999px;padding:14px 24px;font:800 17px Montserrat,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#big svg{width:20px;height:20px}
.idle #ctl{opacity:0} .exp #ctl,.exp #big{display:none}
</style></head>
<body><div id="box"><div id="stage"></div></div>
<div id="big"><span><svg viewBox="0 0 20 20"><path d="M6 4l11 6-11 6z"/></svg><b id="bigt">Xem video tình huống</b></span></div>
<div id="ctl"><button id="pp" aria-label="Phát"><svg viewBox="0 0 20 20"><path id="ppi" d="M6 4l11 6-11 6z"/></svg></button>
<div id="bar"><div id="track"></div><div id="fill"></div></div><span id="time">0:00 / 0:00</span>
<button id="mu" aria-label="Tắt tiếng"><svg viewBox="0 0 20 20"><path id="mui" d="M3 7h3l4-3v12l-4-3H3zM13 6.5a5 5 0 0 1 0 7M15 4a8 8 0 0 1 0 12" stroke="#fff" stroke-width="1.6" fill="none"/></svg></button>
<button id="fs" aria-label="Toàn màn hình"><svg viewBox="0 0 20 20"><path d="M3 3h5v2H5v3H3zM12 3h5v5h-2V5h-3zM3 12h2v3h3v2H3zM15 12h2v5h-5v-2h3z"/></svg></button></div>
<script>window.FILM={scenes:__SCENES__,dur:__DUR__};</script>
<style>__CSS__</style>
<script>
(()=>{
const seg=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a))), lerp=(a,b,x)=>a+(b-a)*x, eo=x=>1-Math.pow(1-x,3), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eob=(x,s=1.4)=>{const c3=s+1;return 1+c3*Math.pow(x-1,3)+s*Math.pow(x-1,2);};
const TextFx={fadeFromRight(el,t,t0){ if(!el._w){ const w=el.textContent.split(' '); el.textContent=''; el._w=w.map((x,i)=>{const s=document.createElement('span'); s.textContent=x+(i<w.length-1?' ':''); el.appendChild(s); return s;}); } el._w.forEach((s,i)=>{s.style.opacity=eo(seg(t,t0+i*.11,t0+i*.11+.5));}); }};
window.SC={}; window.kitBase={seg,lerp,eo,ei,eio,eob,TextFx,assets:{url:()=>''},scene(id,o){SC[id]=o;},score(){}};
})();
</script>
<script>__SYNTH__</script>
<script>
(()=>{
const MODS=__MODS__, SCORE=__SCORE__;
for (const m of MODS) new Function('kit','UI',m)(kitBase, window.UI);
const F=window.FILM, st=document.getElementById('stage'), W=__W__, H=__H__;
let acc=0; F.scenes.forEach(s=>{s.start=acc; acc+=s.dur;});
const kit={...kitBase,stage:st,h:h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;}};
let cur=-1;
function frame(T){
  T=Math.max(0,Math.min(F.dur-0.001,T));
  let i=F.scenes.findIndex(s=>T<s.start+s.dur); if(i<0) i=F.scenes.length-1;
  const s=F.scenes[i];
  if(i!==cur){ st.innerHTML=''; kit.dur=s.dur; SC[s.id].init(kit); cur=i; }
  SC[s.id].render(T-s.start,kit);
}
function fit(){ const k=Math.min(innerWidth/W,innerHeight/H); st.style.transform='translate('+((innerWidth-W*k)/2)+'px,'+((innerHeight-H*k)/2)+'px) scale('+k+')'; }
addEventListener('resize',fit); fit();
const exp=/export=1/.test(location.search);
window.__seek=(T)=>{frame(T); return true;};
window.__wav=async()=>{ const b=await FilmSynth.render(SCORE,F.dur); const u=new Uint8Array(FilmSynth.wav(b)); let s=''; for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(s); };
if(exp){ document.body.classList.add('exp'); frame(0); return; }
// phát: nhạc đã dựng sẵn thành file, đồng hồ bám theo audio
const AUD=__AUDIO__; let au=null; if(AUD){ au=new Audio(AUD); au.preload='auto'; }
let playing=false, T=0, muted=false, clockStart=0;
const fmt=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
const fill=document.getElementById('fill'), time=document.getElementById('time'), ppi=document.getElementById('ppi'), big=document.getElementById('big'), bigt=document.getElementById('bigt'), bar=document.getElementById('bar');
F.scenes.forEach((s,i)=>{ if(!i) return; const d=document.createElement('div'); d.className='tick'; d.style.left=(s.start/F.dur*100)+'%'; d.title=s.name; bar.appendChild(d); });
let useAudio=!!au;
function now(){ return useAudio && !au.paused ? au.currentTime : (performance.now()-clockStart)/1000; }
async function play(){ if(T>=F.dur-0.05) T=0; clockStart=performance.now()-T*1000;
  if(au){ try{ au.currentTime=T; au.muted=muted; await au.play(); useAudio=true; }catch(e){ useAudio=false; } }
  playing=true; big.style.display='none'; ppi.setAttribute('d','M5 4h3v12H5zM12 4h3v12h-3z'); loop(); }
function pause(){ T=now(); if(au) au.pause(); playing=false; ppi.setAttribute('d','M6 4l11 6-11 6z'); }
function loop(){ if(!playing) return; T=now(); if(T>=F.dur-0.02){ T=F.dur; pause(); bigt.textContent='Xem lại'; big.style.display='flex'; } frame(T); ui(); requestAnimationFrame(loop); }
function ui(){ fill.style.width=(T/F.dur*100)+'%'; time.textContent=fmt(T)+' / '+fmt(F.dur); }
function seek(x){ T=Math.max(0,Math.min(F.dur,x)); clockStart=performance.now()-T*1000; if(au) au.currentTime=T; frame(T); ui(); }
document.getElementById('pp').onclick=()=>playing?pause():play(); big.onclick=play;
bar.onclick=e=>{ const r=bar.getBoundingClientRect(); seek((e.clientX-r.left)/r.width*F.dur); };
document.getElementById('mu').onclick=()=>{ muted=!muted; if(au) au.muted=muted; document.getElementById('mui').style.opacity=muted?.4:1; };
document.getElementById('fs').onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); playing?pause():play(); } });
let idle; addEventListener('pointermove',()=>{ document.body.classList.remove('idle'); clearTimeout(idle); idle=setTimeout(()=>playing&&document.body.classList.add('idle'),2200); });
const q=/[?&]t=([\d.]+)/.exec(location.search); if(q) T=+q[1];
frame(T); ui();
})();
</script></body></html>
