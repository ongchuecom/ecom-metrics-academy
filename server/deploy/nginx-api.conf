# Thay api.TEN-MIEN-CUA-ANH bằng tên miền phụ trỏ về VPS (bản ghi A), rồi chạy: certbot --nginx -d api.TEN-MIEN-CUA-ANH
limit_req_zone $binary_remote_addr zone=advisor_api:10m rate=60r/m;

server {
    listen 80;
    server_name api.TEN-MIEN-CUA-ANH;
    client_max_body_size 26m;

    location / {
        limit_req zone=advisor_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè, không nối thêm header do người gửi tự khai
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;   # để câu trả lời chạy từng chữ (SSE)
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
